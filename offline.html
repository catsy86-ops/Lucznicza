<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Niebuszewo Guide</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
    }
    .retry-btn {
      margin-top: 24px;
      padding: 12px 24px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #5a52e0;
    }
  </style>
</head>
<body>
  <div class="icon">📵</div>
  <h2>Tryb offline</h2>
  <p>Brak połączenia z internetem.<br>Sprawdź połączenie sieciowe i spróbuj ponownie.</p>
  <p>Pobrane wcześniej mapy i dane miejsc są zapisane w Twojej pamięci podręcznej.</p>
  <button class="retry-btn" onclick="location.reload()">🔄 Odśwież stronę</button>
</body>
</html>
